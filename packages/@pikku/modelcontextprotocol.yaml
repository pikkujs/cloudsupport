package: "@pikku/modelcontextprotocol"
entries:
  - versions: "*"
    cloud:
      edge: false
      serverless: false
    exports:
      ./fetch:
        cloud:
          edge:
            - cloudflare-workers
          serverless: true
    reason: Only the ./fetch entry is edge-safe. Carried over from the declaration in pikkujs/pikku#1962
      (pikku-edge); not re-audited since.
    source: pikkujs/pikku#1962
